<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REFLEX RUSH</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --neon-green: #00ff88;
      --neon-red: #ff2255;
      --neon-blue: #00cfff;
      --neon-yellow: #ffe600;
      --bg: #050810;
      --panel: #0a0f1e;
      --grid: rgba(0, 255, 136, 0.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon-green);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* CRT scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    /* Grid background */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 22px 0 8px;
    }

    .game-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 6vw, 3.6rem);
      letter-spacing: 0.18em;
      color: var(--neon-green);
      text-shadow:
        0 0 10px var(--neon-green),
        0 0 30px var(--neon-green),
        0 0 60px rgba(0,255,136,0.4);
      animation: flicker 8s infinite;
    }

    .subtitle {
      font-size: 0.72rem;
      letter-spacing: 0.35em;
      color: rgba(0,255,136,0.45);
      margin-top: 4px;
      text-transform: uppercase;
    }

    @keyframes flicker {
      0%,96%,100% { opacity: 1; }
      97% { opacity: 0.85; }
      98% { opacity: 1; }
      99% { opacity: 0.7; }
    }

    /* ── HUD ── */
    .hud {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 20px;
      margin: 14px 0 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hud-box {
      background: var(--panel);
      border: 1px solid rgba(0,255,136,0.2);
      border-radius: 4px;
      padding: 8px 22px;
      min-width: 110px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hud-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
      opacity: 0.6;
    }

    .hud-label {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: rgba(0,255,136,0.5);
      text-transform: uppercase;
    }

    .hud-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.2;
      margin-top: 2px;
    }

    .hud-value.score-val { color: var(--neon-green); text-shadow: 0 0 12px var(--neon-green); }
    .hud-value.lives-val { color: var(--neon-red);   text-shadow: 0 0 12px var(--neon-red); }
    .hud-value.best-val  { color: var(--neon-yellow); text-shadow: 0 0 12px var(--neon-yellow); }

    /* ── ARENA ── */
    #arena {
      position: relative;
      z-index: 10;
      width: min(90vw, 700px);
      height: min(60vw, 420px);
      border: 1px solid rgba(0,255,136,0.18);
      border-radius: 6px;
      background: var(--panel);
      overflow: hidden;
      cursor: crosshair;
      box-shadow:
        0 0 0 1px rgba(0,255,136,0.06),
        0 0 40px rgba(0,0,0,0.8),
        inset 0 0 60px rgba(0,255,136,0.02);
    }

    #arena.miss-flash {
      animation: missFlash 0.25s ease-out;
    }

    @keyframes missFlash {
      0%   { box-shadow: inset 0 0 80px rgba(255,34,85,0.45), 0 0 40px rgba(0,0,0,0.8); border-color: var(--neon-red); }
      100% { box-shadow: inset 0 0 60px rgba(0,255,136,0.02), 0 0 40px rgba(0,0,0,0.8); border-color: rgba(0,255,136,0.18); }
    }

    /* Corner decorations */
    .corner { position: absolute; width: 12px; height: 12px; }
    .corner.tl { top: 6px; left: 6px; border-top: 2px solid var(--neon-green); border-left: 2px solid var(--neon-green); }
    .corner.tr { top: 6px; right: 6px; border-top: 2px solid var(--neon-green); border-right: 2px solid var(--neon-green); }
    .corner.bl { bottom: 6px; left: 6px; border-bottom: 2px solid var(--neon-green); border-left: 2px solid var(--neon-green); }
    .corner.br { bottom: 6px; right: 6px; border-bottom: 2px solid var(--neon-green); border-right: 2px solid var(--neon-green); }

    /* ── CIRCLE TARGET ── */
    .circle {
      position: absolute;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      cursor: pointer;
      pointer-events: none;
      transition: transform 0.12s cubic-bezier(0.34,1.56,0.64,1);
    }

    .circle.visible {
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .circle.shrinking {
      animation: shrink var(--duration, 1s) linear forwards;
    }

    @keyframes shrink {
      0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      80%  { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    }

    .circle-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Default green target */
    .circle.green .circle-inner {
      background: radial-gradient(circle at 35% 35%, rgba(0,255,136,0.9), rgba(0,180,80,0.7));
      border: 2px solid var(--neon-green);
      box-shadow: 0 0 18px var(--neon-green), 0 0 40px rgba(0,255,136,0.4), inset 0 0 15px rgba(255,255,255,0.1);
    }

    /* Blue bonus target */
    .circle.blue .circle-inner {
      background: radial-gradient(circle at 35% 35%, rgba(0,207,255,0.9), rgba(0,130,200,0.7));
      border: 2px solid var(--neon-blue);
      box-shadow: 0 0 18px var(--neon-blue), 0 0 40px rgba(0,207,255,0.4), inset 0 0 15px rgba(255,255,255,0.1);
    }

    /* Pulse ring */
    .circle::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid currentColor;
      opacity: 0;
      animation: pulseRing 1s ease-out infinite;
    }
    .circle.green { color: var(--neon-green); }
    .circle.blue  { color: var(--neon-blue); }

    @keyframes pulseRing {
      0%   { transform: scale(0.85); opacity: 0.7; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    /* ── TIMER BAR ── */
    .timer-bar-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(0,255,136,0.08);
    }

    #timer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
      transform-origin: left;
      transition: background 0.3s;
    }

    /* ── OVERLAY SCREENS ── */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5,8,16,0.88);
      z-index: 20;
      border-radius: 6px;
      gap: 16px;
      backdrop-filter: blur(4px);
    }

    .overlay.hidden { display: none; }

    .overlay-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      letter-spacing: 0.15em;
      text-align: center;
    }

    .overlay-title.green { color: var(--neon-green); text-shadow: 0 0 20px var(--neon-green); }
    .overlay-title.red   { color: var(--neon-red);   text-shadow: 0 0 20px var(--neon-red); }

    .overlay-sub {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: rgba(0,255,136,0.5);
      text-align: center;
      max-width: 280px;
      line-height: 1.8;
    }

    .final-score-display {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      color: var(--neon-yellow);
      text-shadow: 0 0 24px var(--neon-yellow);
      line-height: 1;
    }

    .btn {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: var(--bg);
      background: var(--neon-green);
      border: none;
      padding: 12px 32px;
      border-radius: 3px;
      cursor: pointer;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 0 20px rgba(0,255,136,0.4);
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.25) 50%, transparent 100%);
      transform: translateX(-100%);
      transition: transform 0.4s;
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,255,136,0.7); }
    .btn:hover::before { transform: translateX(100%); }
    .btn:active { transform: translateY(0); }

    /* ── FLOATING FEEDBACK ── */
    .float-text {
      position: absolute;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      pointer-events: none;
      z-index: 30;
      animation: floatUp 0.8s ease-out forwards;
      white-space: nowrap;
    }

    .float-text.hit  { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
    .float-text.miss { color: var(--neon-red);   text-shadow: 0 0 10px var(--neon-red); }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, calc(-50% - 50px)) scale(0.8); }
    }

    /* ── LIVES DISPLAY ── */
    .lives-icons {
      display: flex;
      gap: 5px;
      justify-content: center;
      margin-top: 2px;
    }

    .life-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--neon-red);
      box-shadow: 0 0 8px var(--neon-red);
      transition: all 0.3s;
    }

    .life-dot.lost {
      background: rgba(255,34,85,0.12);
      box-shadow: none;
      border: 1px solid rgba(255,34,85,0.2);
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 10;
      margin-top: 12px;
      font-size: 0.62rem;
      letter-spacing: 0.25em;
      color: rgba(0,255,136,0.25);
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="game-title">REFLEX RUSH</div>
    <div class="subtitle">Test your reaction speed</div>
  </header>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">Score</div>
      <div class="hud-value score-val" id="score-display">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Lives</div>
      <div class="lives-icons" id="lives-display"></div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Best</div>
      <div class="hud-value best-val" id="best-display">0</div>
    </div>
  </div>

  <div id="arena">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- Timer bar -->
    <div class="timer-bar-wrap">
      <div id="timer-bar"></div>
    </div>

    <!-- Target circle -->
    <div class="circle green" id="circle">
      <div class="circle-inner"></div>
    </div>

    <!-- Start overlay -->
    <div class="overlay" id="start-overlay">
      <div class="overlay-title green">READY?</div>
      <div class="overlay-sub">
        A circle will flash on screen for<br/>
        <strong style="color:var(--neon-green)">1 second</strong>.<br/>
        Click it to score. Miss it — lose a life.<br/>
        <span style="color:var(--neon-blue)">Blue circles</span> are worth <strong style="color:var(--neon-blue)">2 points!</strong>
      </div>
      <button class="btn" id="start-btn">START GAME</button>
    </div>

    <!-- Game over overlay -->
    <div class="overlay hidden" id="gameover-overlay">
      <div class="overlay-title red">GAME OVER</div>
      <div class="final-score-display" id="final-score">0</div>
      <div class="overlay-sub" id="gameover-msg">Keep practising, agent.</div>
      <button class="btn" id="restart-btn">TRY AGAIN</button>
    </div>
  </div>

  <footer>CLICK THE CIRCLE &nbsp;|&nbsp; EVERY MILLISECOND COUNTS</footer>

<script>
  const TOTAL_LIVES = 3;
  const BASE_DURATION = 1000; // ms the circle is visible
  const PADDING = 50;

  let score = 0;
  let lives = TOTAL_LIVES;
  let best = parseInt(localStorage.getItem('reflexBest') || '0');
  let circleTimeout = null;
  let timerRaf = null;
  let circleActive = false;
  let gameRunning = false;
  let spawnTimeout = null;

  const arena        = document.getElementById('arena');
  const circle       = document.getElementById('circle');
  const timerBar     = document.getElementById('timer-bar');
  const scoreEl      = document.getElementById('score-display');
  const livesEl      = document.getElementById('lives-display');
  const bestEl       = document.getElementById('best-display');
  const startOverlay = document.getElementById('start-overlay');
  const gameoverOverlay = document.getElementById('gameover-overlay');
  const finalScoreEl = document.getElementById('final-score');
  const gameoverMsg  = document.getElementById('gameover-msg');

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);

  // ── Init ──
  bestEl.textContent = best;
  renderLives();

  function renderLives() {
    livesEl.innerHTML = '';
    for (let i = 0; i < TOTAL_LIVES; i++) {
      const dot = document.createElement('div');
      dot.className = 'life-dot' + (i >= lives ? ' lost' : '');
      livesEl.appendChild(dot);
    }
  }

  function startGame() {
    score = 0;
    lives = TOTAL_LIVES;
    circleActive = false;
    gameRunning = true;

    startOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');

    scoreEl.textContent = score;
    renderLives();
    hideCircle();

    scheduleNext(400);
  }

  function scheduleNext(delay = 600) {
    clearTimeout(spawnTimeout);
    if (!gameRunning) return;
    // Vary the gap slightly so it's not totally predictable
    const jitter = Math.random() * 400;
    spawnTimeout = setTimeout(showCircle, delay + jitter);
  }

  function showCircle() {
    if (!gameRunning) return;

    const arenaRect = arena.getBoundingClientRect();
    const r = 31; // radius

    const maxX = arenaRect.width  - PADDING;
    const maxY = arenaRect.height - PADDING - 10; // above timer bar
    const x = PADDING + Math.random() * (maxX - PADDING);
    const y = PADDING + Math.random() * (maxY - PADDING);

    // Randomly make it a bonus blue circle (~20%)
    const isBonus = Math.random() < 0.2;
    circle.className = 'circle ' + (isBonus ? 'blue' : 'green') + ' visible shrinking';
    circle.style.setProperty('--duration', BASE_DURATION + 'ms');
    circle.style.left = x + 'px';
    circle.style.top  = y + 'px';
    circle.dataset.bonus = isBonus ? '2' : '1';

    circleActive = true;

    // Animate timer bar
    animateTimerBar(BASE_DURATION);

    // Auto-expire after duration
    circleTimeout = setTimeout(() => {
      if (circleActive) {
        miss(x, y);
      }
    }, BASE_DURATION);
  }

  function animateTimerBar(duration) {
    cancelAnimationFrame(timerRaf);
    const start = performance.now();
    timerBar.style.transition = 'none';
    timerBar.style.transform = 'scaleX(1)';

    function step(now) {
      const elapsed = now - start;
      const progress = Math.max(0, 1 - elapsed / duration);
      timerBar.style.transform = `scaleX(${progress})`;
      const hue = progress > 0.4 ? 160 : (progress > 0.2 ? 50 : 350);
      timerBar.style.background = `hsl(${hue}, 100%, 55%)`;
      if (progress > 0 && circleActive) {
        timerRaf = requestAnimationFrame(step);
      }
    }
    timerRaf = requestAnimationFrame(step);
  }

  function hideCircle() {
    clearTimeout(circleTimeout);
    cancelAnimationFrame(timerRaf);
    circle.className = 'circle green';
    circleActive = false;
    timerBar.style.transform = 'scaleX(0)';
  }

  function miss(x, y) {
    if (!gameRunning) return;
    circleActive = false;
    hideCircle();

    lives--;
    renderLives();

    // Flash arena red
    arena.classList.remove('miss-flash');
    void arena.offsetWidth;
    arena.classList.add('miss-flash');
    arena.addEventListener('animationend', () => arena.classList.remove('miss-flash'), { once: true });

    // Float text
    spawnFloat('MISS', x, y, 'miss');

    if (lives <= 0) {
      endGame();
    } else {
      scheduleNext(800);
    }
  }

  circle.addEventListener('click', (e) => {
    if (!circleActive || !gameRunning) return;
    e.stopPropagation();

    const pts = parseInt(circle.dataset.bonus || '1');
    score += pts;
    scoreEl.textContent = score;

    const cx = parseFloat(circle.style.left);
    const cy = parseFloat(circle.style.top);

    circleActive = false;
    clearTimeout(circleTimeout);
    cancelAnimationFrame(timerRaf);

    // Hit animation
    circle.className = 'circle ' + (pts === 2 ? 'blue' : 'green');
    circle.style.transform = 'translate(-50%,-50%) scale(1.4)';
    circle.style.opacity = '0';
    circle.style.transition = 'transform 0.18s ease-out, opacity 0.18s ease-out';
    setTimeout(() => { circle.style.transition = ''; hideCircle(); }, 200);

    // Float feedback
    spawnFloat(pts === 2 ? '+2 BONUS!' : '+1', cx, cy, 'hit');

    scheduleNext(350);
  });

  // Miss on arena click (missed the circle)
  arena.addEventListener('click', (e) => {
    if (!gameRunning) return;
    // Only count as miss if circle is visible and click is outside circle
    if (circleActive) {
      const rect = arena.getBoundingClientRect();
      const cx = rect.left + parseFloat(circle.style.left);
      const cy = rect.top  + parseFloat(circle.style.top);
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      if (Math.sqrt(dx*dx + dy*dy) > 38) {
        // Clicked outside circle while it's active — counts as miss
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        clearTimeout(circleTimeout);
        miss(x, y);
      }
    }
  });

  function endGame() {
    gameRunning = false;
    hideCircle();
    clearTimeout(spawnTimeout);

    if (score > best) {
      best = score;
      localStorage.setItem('reflexBest', best);
      bestEl.textContent = best;
    }

    finalScoreEl.textContent = score;

    const msgs = [
      'Keep practising, agent.',
      'Your reflexes need calibration.',
      'Almost had it. Try again.',
      'The grid demands faster hands.',
      'Neural link... unstable.',
    ];
    if (score >= 15) gameoverMsg.textContent = 'Outstanding reflexes, agent!';
    else if (score >= 8) gameoverMsg.textContent = 'Solid performance. Push further.';
    else gameoverMsg.textContent = msgs[Math.floor(Math.random() * msgs.length)];

    gameoverOverlay.classList.remove('hidden');
  }

  function spawnFloat(text, x, y, type) {
    const el = document.createElement('div');
    el.className = 'float-text ' + type;
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    arena.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
</script>
</body>
</html>
